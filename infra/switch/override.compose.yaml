services:
  postgres:
    restart: unless-stopped
    ports: !reset []
  switch:
    restart: unless-stopped
    environment:
      ID_SERVER_NAME: creatorroom.local
      MATRIX_SERVER_NAME: creatorroom.local
      THIRD_PARTY_AVATARS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  gateway:
    restart: unless-stopped
networks:
  default:
    name: creatorroom-switch
